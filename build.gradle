plugins { id 'com.android.application' }

android {
    namespace 'ru.perekup.nativegame'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.perekup.nativegame'
        minSdk 23
        targetSdk 28
        versionCode 20
        versionName '2.0-native'
        externalNativeBuild { cmake { cppFlags '-std=c++17 -Wall -Wextra' } }
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
}
